<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArchiDB – Enterprise Database Solutions</title>
<style>
:root{--bg:#f4f7fb;--fg:#0c1b33;--card:#fff;--mut:#51607a;--acc:#1a6fe0;--line:#dbe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142b;--fg:#e8eefb;--card:#0e2247;--mut:#9fb0cf;--acc:#4da3ff;--line:#1c355f}}
:root[data-theme="dark"]{--bg:#07142b;--fg:#e8eefb;--card:#0e2247;--mut:#9fb0cf;--acc:#4da3ff;--line:#1c355f}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc)}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;gap:16px;height:56px}
.logo{font-weight:800;letter-spacing:.06em;text-decoration:none;color:var(--fg)}.logo b{color:var(--acc)}
nav{margin-left:auto;display:flex;gap:16px;align-items:center;overflow-x:auto}
nav a{color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap}nav a:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:none;color:var(--mut);padding:5px 10px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:#fff}
.hero img{display:block;width:100%;height:auto;max-height:640px;object-fit:cover}
.hero .w{padding:36px 20px 8px;text-align:center}
h1{font-size:clamp(26px,4.5vw,42px);line-height:1.15;margin:0 0 12px}
.lead{color:var(--mut);max-width:680px;margin:0 auto 22px;font-size:18px}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;margin:4px}
.btn.o{background:none;color:var(--acc);border:2px solid var(--acc)}
section{padding:52px 0}
h2{font-size:28px;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 26px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.c h3{margin:0 0 6px;font-size:18px}.c p{margin:0;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips span{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:14px}
.badge{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;margin-bottom:10px}
.alt{background:var(--card);border-block:1px solid var(--line)}
.alt .c{background:var(--bg)}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#1a6fe0,#0a2a5e);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;flex:none}
.f{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.f>div:last-child{flex:1;min-width:240px}
footer{padding:28px 0;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
footer .w{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.fm label{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}.fm input,.fm textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin-top:4px}.fm .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.fm .ck{display:flex;gap:10px;align-items:flex-start}.fm .ck input{width:auto;margin-top:5px}.fm button{border:0;cursor:pointer;font:inherit;font-weight:700}
</style></head><body>

k_t:"Kontakt",k_s:"Erzählen Sie uns von Ihrem Projekt – wir melden uns zeitnah.",imp:"Impressum",dp:"Datenschutz",imp_b:`<h3>Angaben gemäß § 5 DDG</h3><p>ArchiDB – Inhaber: Vladislav Sloboder<br>Einzelunternehmen<br>Erkrather Str. 38<br>42329 Wuppertal<br>Deutschland</p><h3>Kontakt</h3><p>E-Mail: info@archidb.de<br>LinkedIn: <a href="https://www.linkedin.com/company/archidb/" target="_blank" rel="noopener">linkedin.com/company/archidb</a> (Nachricht an die Unternehmensseite)</p><p>Anfragen beantworte ich in der Regel innerhalb von zwei Werktagen.</p><h3>Inhaltlich verantwortlich (§ 18 Abs. 2 MStV)</h3><p>Vladislav Sloboder, Anschrift wie oben</p><h3>Verbraucherstreitbeilegung</h3><p>Ich bin weder bereit noch verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.</p><h3>Haftung für Links</h3><p>Für Inhalte externer Seiten, auf die diese Website verlinkt, sind ausschließlich deren Betreiber verantwortlich. Zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar.</p>`,
dp_b:`<h3>Verantwortlicher</h3><p>Vladislav Sloboder, ArchiDB, Erkrather Str. 38, 42329 Wuppertal, E-Mail: info@archidb.de</p><h3>Hosting und Server-Logfiles</h3><p>Diese Website wird bei GitHub Pages gehostet (GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA, ein Unternehmen der Microsoft-Gruppe). Die Domain und die E-Mail-Postfächer werden bei der IONOS SE, Elgendorfer Str. 57, 56410 Montabaur, betrieben. Beim Aufruf werden technisch notwendig Daten wie IP-Adresse, Datum und Uhrzeit, aufgerufene Seite und Browsertyp in Server-Logfiles verarbeitet. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (sicherer und stabiler Betrieb der Website). Übermittlungen in die USA stützen sich auf EU-Standardvertragsklauseln bzw. das EU-US Data Privacy Framework.</p><h3>Kontaktaufnahme</h3><p>Wenn Sie mir per E-Mail schreiben, verarbeite ich Ihre Angaben zur Bearbeitung der Anfrage (Art. 6 Abs. 1 lit. b oder f DSGVO) und lösche sie, sobald sie nicht mehr erforderlich sind und keine Aufbewahrungspflichten bestehen.</p><h3>Spracheinstellung</h3><p>Ihre gewählte Sprache wird lokal in Ihrem Browser gespeichert. Es werden keine personenbezogenen Daten übertragen; die Speicherung ist für die von Ihnen gewünschte Funktion erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG).</p><div class="an"><h3>Reichweitenmessung</h3><p>Diese Website nutzt {tool}, eine datenschutzfreundliche Reichweitenmessung ohne Cookies und ohne Profilbildung. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (Interesse an der Optimierung des Angebots).</p></div><div class="hs"><h3>Kontaktformular (HubSpot)</h3><p>Wenn Sie das Kontaktformular nutzen, werden Ihre Angaben (Name, E-Mail, Unternehmen, optional Telefonnummer, Nachricht) an HubSpot (HubSpot Ireland Limited, Dublin, Irland; Muttergesellschaft HubSpot, Inc., USA) übermittelt und in meinem CRM gespeichert, um Ihre Anfrage zu bearbeiten. Rechtsgrundlage ist Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO), bei konkreten Vertragsanfragen Art. 6 Abs. 1 lit. b DSGVO. Mit HubSpot besteht ein Auftragsverarbeitungsvertrag. Die Daten werden im EU-Rechenzentrum gespeichert; bei einer Übermittlung in die USA gelten EU-Standardvertragsklauseln. Das Formular setzt keine Tracking-Cookies.</p></div><h3>Externe Links</h3><p>Die Seite verlinkt auf LinkedIn. Es werden keine Plug-ins eingebunden; Daten werden erst übertragen, wenn Sie den Link anklicken. Es gilt dann die Datenschutzerklärung von LinkedIn.</p><h3>Ihre Rechte</h3><p>Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch (Art. 15–21 DSGVO).</p><h3>Beschwerderecht</h3><p>Zuständig ist die Landesbeauftragte für Datenschutz und Informationsfreiheit Nordrhein-Westfalen, Kavalleriestraße 2–4, 40213 Düsseldorf.</p>`},

dp_b:`<p><i>Convenience translation – the German version is legally binding.</i></p><h3>Controller</h3><p>Vladislav Sloboder, ArchiDB, Erkrather Str. 38, 42329 Wuppertal, Germany, email: info@archidb.de</p><h3>Hosting and server log files</h3><p>This website is hosted on GitHub Pages (GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA, a Microsoft company). The domain and email mailboxes are operated by IONOS SE, Elgendorfer Str. 57, 56410 Montabaur, Germany. When you visit, technically necessary data such as IP address, date and time, requested page and browser type is processed in server log files. Legal basis: Art. 6(1)(f) GDPR (secure and stable operation). Transfers to the USA rely on EU standard contractual clauses and/or the EU-US Data Privacy Framework.</p><h3>Contact</h3><p>If you email me, I process your details to handle your request (Art. 6(1)(b) or (f) GDPR) and delete them once no longer needed and no retention duties apply.</p><h3>Language setting</h3><p>Your chosen language is stored locally in your browser. No personal data is transmitted; storage is required for the function you requested (§ 25 (2) no. 2 TDDDG).</p><div class="an"><h3>Audience measurement</h3><p>This website uses {tool}, a privacy-friendly analytics service without cookies or profiling. Legal basis: Art. 6(1)(f) GDPR (interest in improving the site).</p></div><div class="hs"><h3>Contact form (HubSpot)</h3><p>If you use the contact form, your details (name, email, company, optional phone number, message) are sent to HubSpot (HubSpot Ireland Limited, Dublin, Ireland; parent company HubSpot, Inc., USA) and stored in my CRM to handle your enquiry. Legal basis: your consent (Art. 6(1)(a) GDPR), for concrete contract enquiries Art. 6(1)(b) GDPR. A data processing agreement is in place with HubSpot. Data is stored in the EU data centre; any transfer to the USA is covered by EU standard contractual clauses. The form sets no tracking cookies.</p></div><h3>External links</h3><p>The site links to LinkedIn. No plug-ins are embedded; data is only transferred when you click the link, and LinkedIn's privacy policy then applies.</p><h3>Your rights</h3><p>You have the right of access, rectification, erasure, restriction, data portability and objection (Art. 15–21 GDPR).</p><h3>Right to lodge a complaint</h3><p>The competent authority is the State Commissioner for Data Protection and Freedom of Information of North Rhine-Westphalia, Kavalleriestraße 2–4, 40213 Düsseldorf, Germany.</p>`}};
function setLang(l){var d=T[l];document.documentElement.lang=l;
document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=d[e.dataset.i]});
document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});

try{localStorage.setItem("lang",l)}catch(e){}route()}

else if(L){document.getElementById("lt").textContent=T[d][L[0]];var b=document.getElementById("lb");
b.innerHTML=T[d][L[1]].replace("{tool}",CFG.tool).replace("{tel}",CFG.phone||(d==="de"?"[Telefonnummer]":"[phone]"));
if(!CFG.analytics)b.querySelectorAll(".an").forEach(function(e){e.remove()});if(!(CFG.hsPortal&&CFG.hsForm))b.querySelectorAll(".hs").forEach(function(e){e.remove()});window.scrollTo(0,0)}
else{var e=h.length>1&&document.querySelector(h);if(e)e.scrollIntoView()}}

.then(function(r){if(!r.ok)throw 0;st.textContent=d.f_ok;["cf_fn","cf_ln","cf_em","cf_co","cf_ph","cf_msg"].forEach(function(i){$(i).value=""});$("cf_ck").checked=false})
